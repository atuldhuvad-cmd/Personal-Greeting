<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="j_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1931"/>
      <stop offset="60%" stop-color="#153e75"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <radialGradient id="j_aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0a1931" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#j_bg)"/>
  <circle cx="400" cy="230" r="260" fill="url(#j_aura)"/>

  <!-- Peacock Feather (Mor Pankh) -->
  <g transform="translate(400, 150) scale(1.1)">
    <path d="M0,80 Q-50,-20 0,-100 Q50,-20 0,80 Z" fill="#047857" stroke="#10b981" stroke-width="2"/>
    <path d="M0,60 Q-35,-15 0,-75 Q35,-15 0,60 Z" fill="#0284c7"/>
    <path d="M0,45 Q-20,-10 0,-55 Q20,-10 0,45 Z" fill="#7c3aed"/>
    <circle cx="0" cy="-10" r="14" fill="#fbbf24"/>
    <circle cx="0" cy="-10" r="8" fill="#1e3a8a"/>
  </g>

  <!-- Golden Bansuri (Flute) -->
  <g transform="translate(400, 260) rotate(-15)">
    <rect x="-180" y="-10" width="360" height="20" rx="10" fill="#facc15" stroke="#b45309" stroke-width="3"/>
    <!-- Flute holes -->
    <circle cx="-60" cy="0" r="4.5" fill="#78350f"/>
    <circle cx="-20" cy="0" r="4.5" fill="#78350f"/>
    <circle cx="20" cy="0" r="4.5" fill="#78350f"/>
    <circle cx="60" cy="0" r="4.5" fill="#78350f"/>
    <circle cx="100" cy="0" r="4.5" fill="#78350f"/>
    <!-- Hanging pearls/tassels -->
    <g transform="translate(-160, 10)">
      <line x1="0" y1="0" x2="0" y2="40" stroke="#f43f5e" stroke-width="3"/>
      <circle cx="0" cy="45" r="7" fill="#f43f5e"/>
    </g>
  </g>

  <!-- Makhan Matki (Butter Pot) -->
  <g transform="translate(400, 390)">
    <ellipse cx="0" cy="40" rx="90" ry="25" fill="#1e293b"/>
    <path d="M-75,30 Q-95,-30 -35,-50 L35,-50 Q95,-30 75,30 Z" fill="#92400e" stroke="#fbbf24" stroke-width="3"/>
    <!-- Overflowing butter -->
    <ellipse cx="0" cy="-50" rx="42" ry="14" fill="#fef9c3"/>
    <path d="M-30,-50 Q-25,-20 -15,-20 Q-5,-20 -10,-50 Z" fill="#fef9c3"/>
    <path d="M10,-50 Q15,-10 25,-10 Q35,-10 30,-50 Z" fill="#fef9c3"/>
  </g>
</svg>
