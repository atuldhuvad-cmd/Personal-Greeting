<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="r_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a0e17"/>
      <stop offset="50%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <radialGradient id="r_glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#ea580c" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4a0e17" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silk_thread" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="25%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="75%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <radialGradient id="gold_rakhi" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <radialGradient id="flame_glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fde047"/>
      <stop offset="75%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#r_bg)"/>
  <circle cx="400" cy="220" r="270" fill="url(#r_glow)"/>

  <!-- Brother & Sister Celebrating (Silhouettes / Stylized Art on Left & Right) -->
  <!-- Sister tying Rakhi on Brother's wrist -->
  <g transform="translate(180, 240) scale(0.9)">
    <!-- Sister Silhouette -->
    <path d="M-80,120 Q-90,40 -60,0 Q-40,-30 -20,-10 Q-30,40 -40,120 Z" fill="#fff7ed" opacity="0.85"/>
    <circle cx="-50" cy="-25" r="22" fill="#fff7ed" opacity="0.9"/>
    <path d="M-30,-20 Q-10,-10 20,10 Q5,30 -20,20 Z" fill="#fff7ed" opacity="0.85"/> <!-- Sister's arm reaching forward -->
  </g>
  <g transform="translate(620, 240) scale(0.9) scale(-1, 1)">
    <!-- Brother Silhouette with wrist forward -->
    <path d="M-80,120 Q-90,30 -60,-10 Q-40,-40 -20,-20 Q-30,40 -40,120 Z" fill="#fff7ed" opacity="0.85"/>
    <circle cx="-50" cy="-35" r="24" fill="#fff7ed" opacity="0.9"/>
    <path d="M-30,-15 Q-10,-5 25,10 Q10,30 -15,15 Z" fill="#fff7ed" opacity="0.85"/> <!-- Brother's arm reaching forward -->
  </g>

  <!-- Big Central Ornate Rakhi with Silk Threads -->
  <!-- Silk Thread Waves -->
  <path d="M30,220 C160,140 280,150 340,210" fill="none" stroke="url(#silk_thread)" stroke-width="14" stroke-linecap="round"/>
  <path d="M460,210 C520,150 640,140 770,220" fill="none" stroke="url(#silk_thread)" stroke-width="14" stroke-linecap="round"/>
  <path d="M40,240 C170,170 270,170 330,225" fill="none" stroke="#fef08a" stroke-width="5" stroke-linecap="round"/>
  <path d="M470,225 C530,170 630,170 760,240" fill="none" stroke="#fef08a" stroke-width="5" stroke-linecap="round"/>

  <!-- Golden Centerpiece Rakhi Medallion -->
  <g transform="translate(400, 210)">
    <!-- Outer Golden Floral Petals -->
    <circle r="95" fill="#facc15" stroke="#b45309" stroke-width="3"/>
    <circle r="82" fill="#dc2626"/>
    <!-- Petals Ring -->
    <g fill="#fef08a">
      <circle cx="0" cy="-72" r="10"/>
      <circle cx="51" cy="-51" r="10"/>
      <circle cx="72" cy="0" r="10"/>
      <circle cx="51" cy="51" r="10"/>
      <circle cx="0" cy="72" r="10"/>
      <circle cx="-51" cy="51" r="10"/>
      <circle cx="-72" cy="0" r="10"/>
      <circle cx="-51" cy="-51" r="10"/>
    </g>
    <!-- Inner Golden Circle -->
    <circle r="60" fill="url(#gold_rakhi)"/>
    <circle r="44" fill="#991b1b"/>
    <!-- Sacred Auspicious Center Symbol / Kalash / Swastik -->
    <circle r="26" fill="#fef08a" stroke="#b45309" stroke-width="2"/>
    <circle r="12" fill="#dc2626"/>
    <circle r="5" fill="#ffffff"/>
  </g>

  <!-- Traditional Pooja Thali (Bottom Center) -->
  <g transform="translate(400, 410)">
    <!-- Thali Plate -->
    <ellipse cx="0" cy="20" rx="220" ry="48" fill="#78350f" stroke="#fbbf24" stroke-width="4"/>
    <ellipse cx="0" cy="16" rx="195" ry="38" fill="#b45309"/>
    <ellipse cx="0" cy="14" rx="170" ry="30" fill="#fef08a"/>

    <!-- Glowing Clay Diya on Thali -->
    <g transform="translate(0, -5)">
      <ellipse cx="0" cy="18" rx="35" ry="12" fill="#78350f"/>
      <path d="M-30,16 Q0,38 30,16 Q0,2 -30,16 Z" fill="#ea580c" stroke="#fbbf24" stroke-width="2"/>
      <path d="M0,14 Q-12,-15 0,-40 Q12,-15 0,14 Z" fill="url(#flame_glow)"/>
      <circle cx="0" cy="-10" r="6" fill="#fff"/>
    </g>

    <!-- Roli & Chawal Bowls (Kumkum & Rice) -->
    <g transform="translate(-90, 8)">
      <ellipse cx="0" cy="8" rx="26" ry="12" fill="#78350f"/>
      <ellipse cx="0" cy="6" rx="22" ry="9" fill="#dc2626"/> <!-- Bright Red Kumkum -->
    </g>
    <g transform="translate(-45, 14)">
      <ellipse cx="0" cy="6" rx="20" ry="10" fill="#78350f"/>
      <ellipse cx="0" cy="4" rx="17" ry="7" fill="#ffffff"/> <!-- White Sacred Rice -->
    </g>

    <!-- Traditional Festive Sweets (Laddoo / Kaju Katli) -->
    <g transform="translate(75, 10)">
      <circle cx="-15" cy="5" r="11" fill="#f59e0b"/>
      <circle cx="10" cy="3" r="11" fill="#fbbf24"/>
      <circle cx="0" cy="-6" r="11" fill="#f59e0b"/>
    </g>
  </g>

  <!-- Sparkles -->
  <g fill="#fef08a" opacity="0.9">
    <circle cx="280" cy="90" r="5"/>
    <circle cx="520" cy="80" r="6"/>
    <circle cx="160" cy="140" r="4"/>
    <circle cx="640" cy="130" r="4"/>
  </g>
</svg>
