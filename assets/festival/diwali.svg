<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="d_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#120420"/>
      <stop offset="60%" stop-color="#2a0845"/>
      <stop offset="100%" stop-color="#4a1236"/>
    </linearGradient>
    <radialGradient id="d_glow" cx="50%" cy="65%" r="60%">
      <stop offset="0%" stop-color="#ffcc00" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#ff6600" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff0066" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flame" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ffff55"/>
      <stop offset="70%" stop-color="#ff8800"/>
      <stop offset="100%" stop-color="#ff2200" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#d_bg)"/>
  <circle cx="400" cy="300" r="300" fill="url(#d_glow)"/>

  <!-- Hanging lanterns -->
  <g opacity="0.85">
    <line x1="120" y1="0" x2="120" y2="90" stroke="#ffd700" stroke-width="2"/>
    <polygon points="120,90 145,130 95,130" fill="#ff4500"/>
    <polygon points="95,130 145,130 120,170" fill="#ffd700"/>
    <circle cx="120" cy="130" r="8" fill="#fff" filter="url(#glow)"/>

    <line x1="680" y1="0" x2="680" y2="90" stroke="#ffd700" stroke-width="2"/>
    <polygon points="680,90 705,130 655,130" fill="#ff4500"/>
    <polygon points="655,130 705,130 680,170" fill="#ffd700"/>
    <circle cx="680" cy="130" r="8" fill="#fff" filter="url(#glow)"/>

    <line x1="260" y1="0" x2="260" y2="60" stroke="#ffd700" stroke-width="1.5"/>
    <polygon points="260,60 280,95 240,95" fill="#e02424"/>
    <polygon points="240,95 280,95 260,125" fill="#faca15"/>

    <line x1="540" y1="0" x2="540" y2="60" stroke="#ffd700" stroke-width="1.5"/>
    <polygon points="540,60 560,95 520,95" fill="#e02424"/>
    <polygon points="520,95 560,95 540,125" fill="#faca15"/>
  </g>

  <!-- Rangoli Mandala floor -->
  <g transform="translate(400, 390) scale(1, 0.45)" opacity="0.6">
    <circle r="220" fill="none" stroke="#facc15" stroke-width="4" stroke-dasharray="8,6"/>
    <circle r="170" fill="none" stroke="#f43f5e" stroke-width="3"/>
    <circle r="120" fill="none" stroke="#ffd700" stroke-width="2" stroke-dasharray="4,4"/>
  </g>

  <!-- Big Center Diya -->
  <g transform="translate(400, 360)">
    <ellipse cx="0" cy="50" rx="140" ry="30" fill="#991b1b"/>
    <path d="M-130,40 Q0,110 130,40 Q0,10 -130,40 Z" fill="#b45309" stroke="#fde047" stroke-width="3"/>
    <ellipse cx="0" cy="38" rx="120" ry="20" fill="#78350f"/>
    <ellipse cx="0" cy="36" rx="90" ry="12" fill="#f59e0b"/>
    <path d="M0,35 Q-40,-50 0,-100 Q40,-50 0,35 Z" fill="url(#flame)" filter="url(#glow)"/>
    <circle cx="0" cy="-20" r="14" fill="#ffffff" filter="url(#glow)"/>
  </g>

  <!-- Side Diyas -->
  <g transform="translate(180, 400)">
    <path d="M-60,18 Q0,50 60,18 Q0,5 -60,18 Z" fill="#b45309" stroke="#fde047" stroke-width="2"/>
    <path d="M0,16 Q-20,-20 0,-50 Q20,-20 0,16 Z" fill="url(#flame)" filter="url(#glow)"/>
  </g>
  <g transform="translate(620, 400)">
    <path d="M-60,18 Q0,50 60,18 Q0,5 -60,18 Z" fill="#b45309" stroke="#fde047" stroke-width="2"/>
    <path d="M0,16 Q-20,-20 0,-50 Q20,-20 0,16 Z" fill="url(#flame)" filter="url(#glow)"/>
  </g>

  <!-- Fireworks & Sparkles -->
  <g fill="#ffd700" filter="url(#glow)">
    <circle cx="340" cy="160" r="4"/>
    <circle cx="460" cy="140" r="5"/>
    <circle cx="200" cy="200" r="3"/>
    <circle cx="600" cy="180" r="4"/>
    <circle cx="400" cy="110" r="6"/>
  </g>
</svg>
