<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="u_sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <radialGradient id="u_sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#u_sky)"/>
  <circle cx="680" cy="120" r="140" fill="url(#u_sun)"/>

  <!-- Big Red Kite in Center -->
  <g transform="translate(380, 200) rotate(-15)">
    <!-- Kite Body -->
    <polygon points="0,-120 90,0 0,120 -90,0" fill="#ef4444" stroke="#ffffff" stroke-width="4"/>
    <polygon points="0,-120 90,0 0,0 -90,0" fill="#f97316"/>
    <line x1="0" y1="-120" x2="0" y2="120" stroke="#fef08a" stroke-width="3"/>
    <path d="M-90,0 Q0,-60 90,0" fill="none" stroke="#fef08a" stroke-width="3"/>
    <!-- Tail -->
    <polygon points="0,120 -25,160 25,160" fill="#facc15"/>
    <path d="M0,160 Q-20,220 30,280 Q-10,340 40,400" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6,4"/>
  </g>

  <!-- Smaller Blue & Yellow Kite -->
  <g transform="translate(180, 140) rotate(25) scale(0.65)">
    <polygon points="0,-120 90,0 0,120 -90,0" fill="#0284c7" stroke="#ffffff" stroke-width="4"/>
    <polygon points="0,-120 90,0 0,0 -90,0" fill="#facc15"/>
    <polygon points="0,120 -25,160 25,160" fill="#ef4444"/>
  </g>

  <!-- Green & Pink Kite -->
  <g transform="translate(620, 280) rotate(-35) scale(0.55)">
    <polygon points="0,-120 90,0 0,120 -90,0" fill="#10b981" stroke="#ffffff" stroke-width="4"/>
    <polygon points="0,-120 90,0 0,0 -90,0" fill="#ec4899"/>
    <polygon points="0,120 -25,160 25,160" fill="#f59e0b"/>
  </g>

  <!-- Firki (String Spool) on bottom right -->
  <g transform="translate(160, 420) rotate(-40) scale(0.8)">
    <rect x="-80" y="-12" width="160" height="24" rx="6" fill="#92400e"/>
    <rect x="-50" y="-30" width="100" height="60" rx="8" fill="#e11d48" stroke="#fbbf24" stroke-width="3"/>
  </g>
</svg>
