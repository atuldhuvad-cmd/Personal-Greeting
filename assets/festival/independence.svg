<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="i_sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#i_sky)"/>

  <!-- Tricolor Waving Bands (Saffron, White, Green) -->
  <path d="M0,120 Q200,60 400,120 T800,120 L800,0 L0,0 Z" fill="#ea580c"/>
  <path d="M0,120 Q200,60 400,120 T800,120 L800,240 Q600,180 400,240 T0,240 Z" fill="#ffffff"/>
  <path d="M0,240 Q200,180 400,240 T800,240 L800,360 Q600,300 400,360 T0,360 Z" fill="#16a34a"/>

  <!-- Ashoka Chakra in Center (24 spokes) -->
  <g transform="translate(400, 180)">
    <circle r="48" fill="none" stroke="#1e3a8a" stroke-width="4"/>
    <circle r="6" fill="#1e3a8a"/>
    <!-- 24 Spokes -->
    <g stroke="#1e3a8a" stroke-width="2">
      <line x1="0" y1="-48" x2="0" y2="48"/>
      <line x1="-48" y1="0" x2="48" y2="0"/>
      <line x1="-34" y1="-34" x2="34" y2="34"/>
      <line x1="-34" y1="34" x2="34" y2="-34"/>
      <line x1="-18" y1="-44" x2="18" y2="44"/>
      <line x1="-44" y1="-18" x2="44" y2="18"/>
      <line x1="-44" y1="18" x2="44" y2="-18"/>
      <line x1="-18" y1="44" x2="18" y2="-44"/>
    </g>
  </g>

  <!-- Flying Peace Doves / Freedom -->
  <g transform="translate(200, 390) scale(0.8)">
    <path d="M0,0 Q30,-40 70,-30 Q50,-10 60,10 Q20,10 0,0 Z" fill="#1e293b"/>
  </g>
  <g transform="translate(600, 390) scale(0.8) scale(-1, 1)">
    <path d="M0,0 Q30,-40 70,-30 Q50,-10 60,10 Q20,10 0,0 Z" fill="#1e293b"/>
  </g>
</svg>
