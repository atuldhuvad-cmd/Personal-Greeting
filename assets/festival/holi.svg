<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="h_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="50%" stop-color="#fdf4ff"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <radialGradient id="pink_splat" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#f43f5e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="yellow_splat" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan_splat" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.85"/>
      <stop offset="65%" stop-color="#0ea5e9" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purple_splat" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.85"/>
      <stop offset="65%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#h_bg)"/>

  <!-- Splashes of Gulal Powder -->
  <circle cx="240" cy="180" r="160" fill="url(#pink_splat)"/>
  <circle cx="560" cy="200" r="170" fill="url(#cyan_splat)"/>
  <circle cx="400" cy="280" r="180" fill="url(#yellow_splat)"/>
  <circle cx="340" cy="380" r="140" fill="url(#purple_splat)"/>

  <!-- Gulal Powder Bowls (Thali) -->
  <g transform="translate(400, 390)">
    <ellipse cx="0" cy="30" rx="260" ry="50" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="4"/>
    
    <!-- Red bowl -->
    <g transform="translate(-130, 10)">
      <ellipse cx="0" cy="15" rx="55" ry="25" fill="#be123c"/>
      <path d="M-50,15 Q0,-35 50,15 Z" fill="#f43f5e"/>
    </g>
    <!-- Yellow bowl -->
    <g transform="translate(-40, 20)">
      <ellipse cx="0" cy="15" rx="55" ry="25" fill="#d97706"/>
      <path d="M-50,15 Q0,-40 50,15 Z" fill="#facc15"/>
    </g>
    <!-- Green bowl -->
    <g transform="translate(50, 20)">
      <ellipse cx="0" cy="15" rx="55" ry="25" fill="#047857"/>
      <path d="M-50,15 Q0,-40 50,15 Z" fill="#10b981"/>
    </g>
    <!-- Blue/Purple bowl -->
    <g transform="translate(140, 10)">
      <ellipse cx="0" cy="15" rx="55" ry="25" fill="#6d28d9"/>
      <path d="M-50,15 Q0,-35 50,15 Z" fill="#8b5cf6"/>
    </g>
  </g>

  <!-- Pichkari (Water Gun) -->
  <g transform="translate(380, 180) rotate(-25)">
    <rect x="-140" y="-12" width="280" height="24" rx="12" fill="#0284c7" stroke="#fde047" stroke-width="3"/>
    <rect x="-170" y="-8" width="40" height="16" rx="4" fill="#fb923c"/>
    <rect x="140" y="-4" width="30" height="8" rx="2" fill="#f59e0b"/>
    <circle cx="-165" cy="0" r="14" fill="#ef4444"/>
  </g>

  <!-- Happy Splash Confetti -->
  <g fill="#ec4899">
    <circle cx="160" cy="110" r="9"/>
    <circle cx="190" cy="80" r="6"/>
    <circle cx="130" cy="150" r="7"/>
  </g>
  <g fill="#06b6d4">
    <circle cx="640" cy="120" r="10"/>
    <circle cx="680" cy="150" r="7"/>
    <circle cx="610" cy="90" r="6"/>
  </g>
</svg>
