<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="du_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="60%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <radialGradient id="du_sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#450a0a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#du_bg)"/>
  <circle cx="400" cy="220" r="260" fill="url(#du_sun)"/>

  <!-- Golden Bow & Fiery Arrow (Lord Rama Dhanush) -->
  <g transform="translate(360, 240) rotate(-25)">
    <!-- Bow -->
    <path d="M-160,-120 Q-30,0 -160,120" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
    <path d="M-160,-120 Q-30,0 -160,120" fill="none" stroke="#d97706" stroke-width="3"/>
    <!-- String -->
    <line x1="-160" y1="-120" x2="-80" y2="0" stroke="#fef08a" stroke-width="2"/>
    <line x1="-80" y1="0" x2="-160" y2="120" stroke="#fef08a" stroke-width="2"/>
    <!-- Arrow -->
    <line x1="-80" y1="0" x2="200" y2="0" stroke="#ffffff" stroke-width="4"/>
    <!-- Arrowhead (Flame) -->
    <polygon points="200,-15 240,0 200,15 210,0" fill="#facc15" stroke="#ef4444" stroke-width="2"/>
    <!-- Feather Tail -->
    <polygon points="-80,0 -110,-12 -100,0 -110,12" fill="#f97316"/>
  </g>

  <!-- Ravana Silhouette / Effigy Flames on right -->
  <g transform="translate(680, 280) scale(0.7)" opacity="0.6">
    <circle cx="0" cy="-60" r="25" fill="#18181b"/>
    <rect x="-35" y="-35" width="70" height="90" rx="10" fill="#18181b"/>
  </g>
</svg>
