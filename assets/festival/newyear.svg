<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ny_sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <radialGradient id="ny_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#facc15" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#ny_sky)"/>
  <circle cx="400" cy="220" r="280" fill="url(#ny_glow)"/>

  <!-- Exploding Fireworks -->
  <g stroke="#facc15" stroke-width="3" stroke-linecap="round">
    <!-- Left Firework -->
    <g transform="translate(180, 140)">
      <line x1="0" y1="0" x2="0" y2="-60"/>
      <line x1="0" y1="0" x2="42" y2="-42"/>
      <line x1="0" y1="0" x2="60" y2="0"/>
      <line x1="0" y1="0" x2="42" y2="42"/>
      <line x1="0" y1="0" x2="0" y2="60"/>
      <line x1="0" y1="0" x2="-42" y2="42"/>
      <line x1="0" y1="0" x2="-60" y2="0"/>
      <line x1="0" y1="0" x2="-42" y2="-42"/>
      <circle cx="0" cy="0" r="8" fill="#fff"/>
    </g>
    <!-- Right Firework (Magenta/Gold) -->
    <g transform="translate(620, 160)" stroke="#ec4899">
      <line x1="0" y1="0" x2="0" y2="-55"/>
      <line x1="0" y1="0" x2="38" y2="-38"/>
      <line x1="0" y1="0" x2="55" y2="0"/>
      <line x1="0" y1="0" x2="38" y2="38"/>
      <line x1="0" y1="0" x2="0" y2="55"/>
      <line x1="0" y1="0" x2="-38" y2="38"/>
      <line x1="0" y1="0" x2="-55" y2="0"/>
      <line x1="0" y1="0" x2="-38" y2="-38"/>
      <circle cx="0" cy="0" r="7" fill="#facc15"/>
    </g>
  </g>

  <!-- Clinking Champagne Flutes Glasses -->
  <g transform="translate(400, 320)">
    <!-- Left Glass -->
    <g transform="translate(-25, 0) rotate(15)">
      <polygon points="-20,-80 20,-80 12,0 -12,0" fill="#fef08a" opacity="0.8" stroke="#ffffff" stroke-width="2"/>
      <line x1="0" y1="0" x2="0" y2="60" stroke="#ffffff" stroke-width="3"/>
      <ellipse cx="0" cy="60" rx="25" ry="8" fill="#ffffff"/>
      <!-- Bubbles -->
      <circle cx="-5" cy="-30" r="3" fill="#fff"/>
      <circle cx="4" cy="-50" r="2.5" fill="#fff"/>
    </g>
    <!-- Right Glass -->
    <g transform="translate(25, 0) rotate(-15)">
      <polygon points="-20,-80 20,-80 12,0 -12,0" fill="#fef08a" opacity="0.8" stroke="#ffffff" stroke-width="2"/>
      <line x1="0" y1="0" x2="0" y2="60" stroke="#ffffff" stroke-width="3"/>
      <ellipse cx="0" cy="60" rx="25" ry="8" fill="#ffffff"/>
      <!-- Bubbles -->
      <circle cx="5" cy="-30" r="3" fill="#fff"/>
      <circle cx="-4" cy="-50" r="2.5" fill="#fff"/>
    </g>
    <!-- Clink Sparkle -->
    <circle cx="0" cy="-65" r="10" fill="#ffffff" filter="drop-shadow(0 0 10px #facc15)"/>
  </g>
</svg>
